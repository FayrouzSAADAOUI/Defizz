version: '3.8'

# docker-compose up -d
# Lance PostgreSQL + le backend ensemble pour dev local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: defizz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      LOG_LEVEL: debug
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: defizz
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: dev-secret-local
    depends_on:
      postgres:
        condition: service_healthy
    # Hot reload en dev
    # volumes:
    #   - ./src:/app/src

volumes:
  pgdata:
